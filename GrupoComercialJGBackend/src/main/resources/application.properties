
# ========================================
# GRUPO COMERCIAL J&G
# CONFIGURACION GENERAL
# ========================================

spring.application.name=GrupoComercialJGBackend

# ========================================
# BASE DE DATOS MYSQL - RAILWAY
# ========================================

spring.datasource.url=${DB_URL:jdbc:mysql://altaria.proxy.rlwy.net:20112/railway}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ========================================
# CONFIGURACION JPA / HIBERNATE
# ========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# SERVIDOR - LOCAL Y RENDER
# ========================================

server.port=${PORT:8080}

# ========================================
# SEGURIDAD DE SESIONES
# ========================================

server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

# Local: HTTP y SameSite=Lax
# Produccion: HTTPS y SameSite=None

server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:lax}

# ========================================
# MANEJO DE ERRORES
# ========================================

server.error.include-message=never
server.error.include-stacktrace=never
